<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>web</title>
    <style>
        @media (max-width: 768px) {
            img {
                width: 90%;
                height: auto;
            }

            video {
                width: 90%;
                height: auto;
            }

            h1 {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <h1>Hello World!</h1>
    <p>這是我的第一個 Python 網頁伺服器。</p>

    <section>
        <h2>遊戲照片</h2>
        <img src="images/photo1.jpg" alt="我的照片" width="960" height="540">
    </section>

    <section>
        <video width="320" height="240" controls>
            <source src="myvideo.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </section>

    <section>
        <div id="myPlot" style="width:100%;max-width:700px"></div>
    </section>

    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <script>
        const xArray = ["競技", "多人", "Rouglike", "生存建造", "FPS"];
        const yArray = [38, 58, 32, 28, 50];

        const layout = { title: "遊戲種類時間佔比" };

        const data = [{ labels: xArray, values: yArray, type: "pie" }];

        Plotly.newPlot("myPlot", data, layout);
    </script>
</body>
</html>
